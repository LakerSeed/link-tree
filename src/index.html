<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árvore de links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">
    <div id="container">
        <div id="profile">
            <img src="/docs/images/avatar-jessica.jpeg" alt="photo">
            <h1>Jessica Randall</h1>
            <p class="subTitle">London, United Kingdom</p>
            <p>"Front-end developer and avid reader"</p>
        </div>
        <div id="links">
            <ul>
                <li class="item"><button>GitHub</button></li>
                <li class="item"><button>Frontend Mentor</button></li>
                <li class="item"><button>LinkedIn</button></li>
                <li class="item"><button>Twitter</button></li>
                <li class="item"><button>Instagram</button></li>
            </ul>
        </div>
    </div>
    <div>
        <input id="theme" type="checkbox" name="" id="theme_switch">
        <ion-icon name="sunny"></ion-icon>
    </div>
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
    <script src="index.js"></script>
</body>
</html>
