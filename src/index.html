<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árvore de links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">
    <div id="container">
        <div id="profile">
            <img src="/docs/images/avatar-jessica.jpeg" alt="photo">
            <h1>Jessica Randall</h1>
            <p class="subTitle">London, United Kingdom</p>
            <p>"Front-end developer and avid reader"</p>
        </div>
        <div id="links">
            <ul>
                <li class="item"><button onclick="gotolink(this)" value="https://www.github.com">GitHub</button></li>
                <li class="item"><button onclick="gotolink(this)" value="https:www.frontendmentor.io//">Frontend Mentor</button></li>
                <li class="item"><button onclick="gotolink(this)" value="https:www.linkedin.com//">LinkedIn</button></li>
                <li class="item"><button onclick="gotolink(this)" value="https://www.twitter.com">Twitter</button></li>
                <li class="item"><button onclick="gotolink(this)" value="https://www.instagram.com">Instagram</button></li>
            </ul>
        </div>
    </div>
    <div id="icon_bg">
        <input id="theme" type="checkbox" name="">
        <ion-icon id="sun" name="sunny"></ion-icon>
        <ion-icon id="moon" name="moon"></ion-icon>
    </div>
    <div id="modal">
        <p>Você será redirecionado para outro site</p>
        <button class="button" id="confirm">Confirmar</button>
        <button class="button" id="refuse">Recusar</button>
    </div>
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
    <script src="index.js"></script>
</body>
</html>
